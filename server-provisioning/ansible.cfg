[defaults]
# roles/ holds the roles specific to this project. bootstrap, firewall and harden come from the
# sre.server collection, under collections_path below, and are named in full in the playbook.
roles_path = ./roles

# Keep the pinned server-baseline here rather than in the operator's ~/.ansible, so the version on
# disk is the version this repository asks for and two checkouts on one machine cannot disagree.
# Gitignored, produced by `make collections`.
collections_path = ./collections

# You can adjust this number based on how many hosts you have
forks = 10

# Enable persistent SSH connections for faster execution
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=5 -o ServerAliveInterval=60 -o Compression=yes

# Command timeout in seconds
timeout = 30

interpreter_python = /usr/bin/python3
