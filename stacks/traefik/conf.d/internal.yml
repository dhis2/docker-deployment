# Internal routes accessible only via VPN (WireGuard).
#
# What keeps these private is the 'internal' entrypoint, which Traefik binds on
# :8443 without publishing it to the host, so only the WireGuard socat forwarder
# on the proxy network can reach it. Every router here must use that entrypoint:
# on 'websecure' the route answers on the public :443 to anyone who sends the
# matching Host header, because *.internal DNS is an inconvenience to an attacker
# rather than an access control.
#
# DNS for *.internal is resolved by CoreDNS inside the WireGuard container.
# TLS is served using the mkcert certificate from overlays/wireguard/certs/.

tls:
  certificates:
    - certFile: /etc/traefik/certs/internal.crt
      keyFile: /etc/traefik/certs/internal.key

http:
  routers:
    grafana-internal:
      rule: 'Host(`grafana.internal`)'
      service: grafana-internal
      entryPoints:
        - internal
      tls: {}
      middlewares:
        - security-internal

  services:
    grafana-internal:
      loadBalancer:
        servers:
          - url: "http://monitoring-grafana:3000"
