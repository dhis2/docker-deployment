shared_buffers = 2GB        # usually 25-40% of RAM
work_mem = 16MB             # memory per sort/hash operation
maintenance_work_mem = 128MB
effective_cache_size = 6GB  # usually ~75% of RAM

# Locally attached SSD/NVMe - random reads cost almost the same as sequential
# ones. Raise towards the 4.0 default for spinning disks or network storage.
random_page_cost = 1.1

