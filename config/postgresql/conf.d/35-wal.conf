# PostgreSQL 16 defaults this to 0.9. 0.8 spreads checkpoint writes over
# slightly less of the interval, i.e. marginally burstier I/O than stock.
checkpoint_completion_target = 0.8

# Trades durability for throughput. Per the PostgreSQL documentation the
# maximum delay between a commit being reported to the client and that
# transaction being safe against a crash is three times wal_writer_delay - so
# 30 seconds at the setting below. A crash loses those transactions; it does
# not corrupt the database, which ends up as if they had aborted cleanly.
# Set to `on` if losing recently committed data is unacceptable.
synchronous_commit = off

# 10000ms is the maximum PostgreSQL accepts (default 200ms).
wal_writer_delay = 10000ms
