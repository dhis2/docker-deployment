# Client authentication for this instance's database. PostgreSQL uses the first
# rule that matches the connection type, database, user and address.
# See docs/reference/postgresql.md and
# https://www.postgresql.org/docs/current/auth-pg-hba-conf.html
#
# "all" in the DATABASE column does not match physical replication, which needs
# its own "replication" rule.

# TYPE  DATABASE     USER  ADDRESS  METHOD
local   all          all            trust
local   replication  all            trust
host    all          all   all      scram-sha-256
